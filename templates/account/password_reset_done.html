{% extends "base.html" %}

{% block title %}Password Reset Sent - Django Scaffold{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Password Reset Sent</h1>
    <p style="margin-bottom: 1.5rem; color: #4b5563; font-size: 0.875rem;">
        We have sent you an email. Please contact us if you do not receive it within a few minutes.
    </p>

    <div class="links">
        <p><a href="{% url 'account_login' %}">Back to Sign in</a></p>
    </div>
</div>
{% endblock %}
