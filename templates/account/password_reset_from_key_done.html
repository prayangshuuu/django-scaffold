{% extends "base.html" %}

{% block title %}Password Changed - Django Scaffold{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Password Changed</h1>
    <p style="margin-bottom: 1.5rem; color: #4b5563; font-size: 0.875rem;">
        Your password is now changed. You can log in using your new password.
    </p>

    <div class="links">
        <p><a href="{% url 'account_login' %}" class="btn">Log In</a></p>
    </div>
</div>
{% endblock %}
