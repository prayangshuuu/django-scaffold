{% extends "base.html" %}

{% block title %}Sign Out - Django Scaffold{% endblock %}

{% block content %}
<div class="auth-card" style="text-align: center;">
    <h1>Sign Out</h1>
    
    <p style="margin-bottom: 1.5rem; color: #4b5563;">Are you sure you want to sign out?</p>

    <form method="POST" action="{% url 'account_logout' %}">
        {% csrf_token %}
        <button type="submit">Sign Out</button>
    </form>
</div>
{% endblock %}
