<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Scaffold{% endblock %}</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --teal-50:  #f0fdfa;
            --teal-100: #ccfbf1;
            --teal-200: #99f6e4;
            --teal-300: #5eead4;
            --teal-400: #2dd4bf;
            --teal-500: #14b8a6;
            --teal-600: #0d9488;
            --teal-700: #0f766e;
            --teal-800: #115e59;
            --teal-900: #134e4a;
            --teal-950: #042f2e;
            --dark:     #060d0c;
            --dark-2:   #0a1412;
            --dark-3:   #0f1f1c;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 5rem;
            right: 1.5rem;
            z-index: 110;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100%;
            max-width: 24rem;
        }
        .toast-msg {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.875rem 1.25rem;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            animation: toastIn 0.3s ease;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .toast-success {
            background-color: #f0fdf4;
            color: #15803d;
            border: 1.5px solid #bbf7d0;
        }
        .toast-error {
            background-color: #fef2f2;
            color: #b91c1c;
            border: 1.5px solid #fecaca;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% if not hide_navbar %}
        {% include "partials/_navbar.html" %}
    {% endif %}

    <main {% if not hide_navbar %}style="padding-top: 68px;"{% endif %}>
        <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            {% if messages %}
                <div class="toast-container" id="toast-messages">
                    {% for message in messages %}
                        <div class="toast-msg {% if message.tags == 'error' %}toast-error{% else %}toast-success{% endif %}">
                            <span>{{ message }}</span>
                            <button onclick="this.parentElement.remove()" style="background:none; border:none; cursor:pointer; color:inherit; font-size:1.1rem; margin-left:0.5rem;">&times;</button>
                        </div>
                    {% endfor %}
                </div>
                <script>
                    setTimeout(() => {
                        const el = document.getElementById('toast-messages');
                        if (el) {
                            el.style.transition = 'opacity 0.5s ease';
                            el.style.opacity = '0';
                            setTimeout(() => el.remove(), 500);
                        }
                    }, 5000);
                </script>
            {% endif %}
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
